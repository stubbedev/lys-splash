name: ci

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@fc87539c0a5bd989cfc802c6112ad31a6daf8db4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gates (vet, lint, test, build)
        run: nix develop -c just check
      - name: Package, units, NixOS module and plymouth's client
        run: nix build -L . .#checks.${{ matrix.system }}.units .#checks.${{ matrix.system }}.module .#checks.${{ matrix.system }}.plymouth-client

  initramfs-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@fc87539c0a5bd989cfc802c6112ad31a6daf8db4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: An initramfs-tools image in Ubuntu holds the splash
        run: ./nix/initramfs-tools-check.sh

  vm:
    strategy:
      fail-fast: false
      matrix:
        check: [vm-e2e, vm-greeter, vm-boot, vm-splash, vm-journal]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free the runner's disk for the VM disk images
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stubbedev/lys-ci/.github/actions/nix-setup@fc87539c0a5bd989cfc802c6112ad31a6daf8db4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: NixOS VMs from a LUKS boot to lys-login's greeter and back down
        run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}
